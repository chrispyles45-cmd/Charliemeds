<meta name="apple-mobile-web-app-title" content="Charlie's Meds">
<title>Charlie's Meds Calendar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--accent:#a0561e;--ink:#2e2219;--muted:#5c4a3c;--line:#cdb79e;--tint:#f8f0e6;--paw:#e2cdb4}
*{box-sizing:border-box}
html,body{margin:0;background:#e9e2d8}
body{font-family:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:14px}
.toolbar button{font:700 16px 'Atkinson Hyperlegible',system-ui,sans-serif;min-height:44px;padding:0 18px;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.toolbar button.print{background:var(--accent);border-color:var(--accent);color:#fff}
.hint{max-width:520px;margin:0 auto 12px;padding:0 16px;text-align:center;font-size:15px;color:#5c4a3c;line-height:1.4}
.hint:empty{display:none}
.toolbar button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{display:flex;justify-content:center;padding:0 12px 24px}
.scaler{transform-origin:top left}
.sheet{width:1056px;height:816px;background:#fff;padding:38px 48px 34px;display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(60,40,20,.15)}
.head{display:flex;justify-content:space-between;align-items:center;height:80px;flex-shrink:0}
.who{display:flex;align-items:center;gap:16px}
.who img{width:78px;height:78px;border-radius:50%;object-fit:cover;border:3px solid var(--accent)}
h1{margin:0;font:700 44px/1 'Fredoka','Segoe UI',system-ui,sans-serif}
.sub{font-size:15px;color:var(--muted);margin-top:4px}
.nav{display:flex;align-items:center;gap:10px}
.arrow{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:#fff;color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.arrow svg{width:20px;height:20px}
.tag{display:flex;align-items:center;gap:12px;border:2.5px solid var(--accent);border-radius:999px;padding:8px 24px 8px 14px}
.tag i{display:block;width:12px;height:12px;border:2.5px solid var(--accent);border-radius:50%}
.tag span{font:600 32px/1 'Fredoka','Segoe UI',system-ui,sans-serif;color:var(--accent)}
.divider{display:flex;align-items:center;gap:12px;margin:14px 0 10px;height:22px;flex-shrink:0}
.divider div{flex-grow:1;height:3px;background:var(--accent);border-radius:2px}
.divider svg{fill:var(--accent);flex-shrink:0}
.wk,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.wk{height:26px;margin-bottom:6px;flex-shrink:0}
.wk div{font:600 15px/26px 'Fredoka','Segoe UI',system-ui,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:center}
.grid{flex-grow:1;min-height:0}
.empty{border-radius:12px;background:var(--tint);display:flex;align-items:center;justify-content:center}
.empty svg{width:30px;height:30px;fill:#e6d3bd;transform:rotate(-15deg)}
.day{border:2px solid var(--line);border-radius:12px;padding:8px 9px;display:flex;flex-direction:column;justify-content:space-between;min-height:0}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.num{font:600 21px/1 'Fredoka','Segoe UI',system-ui,sans-serif}
.top svg{width:16px;height:16px;fill:var(--paw);transform:rotate(15deg)}
.boxes{display:flex;justify-content:space-between;gap:4px}
.boxes div{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700}
.boxes i{display:block;width:21px;height:21px;border:2px solid var(--ink);border-radius:5px}
.trail{display:flex;justify-content:space-between;align-items:center;margin-top:12px;height:28px;flex-shrink:0;padding:0 6px}
.trail svg{width:20px;height:20px;fill:#dcc5aa;flex-shrink:0}
.trail svg:nth-child(odd){transform:translateY(-5px) rotate(90deg)}
.trail svg:nth-child(even){transform:translateY(5px) rotate(90deg)}
@page{size:letter landscape;margin:0}
@media print{
  html,body{background:#fff}
  .toolbar,.arrow,.hint{display:none!important}
  .stage{padding:0;display:block}
  .scaler{transform:none!important;width:auto!important;height:auto!important}
  .sheet{box-shadow:none;width:11in;height:8.5in}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

  while(n%7){html+='<div class="empty">'+PAW+'</div>';n++;}
  var g=document.getElementById('grid');
  g.innerHTML=html;
  g.style.gridTemplateRows='repeat('+(n/7)+',minmax(0,1fr))';
}
function step(k){m+=k;if(m<0){m=11;y--;}if(m>11){m=0;y++;}render();}
document.getElementById('prev').onclick=function(){step(-1)};
document.getElementById('next').onclick=function(){step(1)};
document.getElementById('today').onclick=function(){y=now.getFullYear();m=now.getMonth();render()};
var t='';for(var i=0;i<16;i++)t+=PAW;document.getElementById('trail').innerHTML=t;
function fit(){
  var s=document.getElementById('scaler'), w=Math.min(1, (window.innerWidth-24)/1056);
  s.style.transform='scale('+w+')'; s.style.width=(1056*w)+'px'; s.style.height=(816*w)+'px';
}
window.addEventListener('resize',fit);
var standalone=(window.navigator.standalone===true)||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
document.getElementById('printBtn').onclick=function(){
  var hint=document.getElementById('hint');
  if(standalone){
    var url=location.origin+location.pathname+'?m='+y+'-'+(m+1);
    window.open(url,'_blank');
    hint.textContent='Opening this month in Safari. There, tap the Share button (square with an arrow), then Print.';
    return;
  }
  hint.textContent='';
  try{window.print();}catch(e){}
  setTimeout(function(){hint.textContent='No print window? Tap your browser\'s Share button (square with an arrow), then Print.';},1500);
};
render();fit();
</script>
</body>
</html>
